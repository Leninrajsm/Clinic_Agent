[project]
name = "twocare-scheduling-agent"
version = "0.1.0"
description = "Patient-scheduling agent with an eval harness and a self-improvement loop"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.13",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # time-zone database for zoneinfo; Windows has none built in
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
